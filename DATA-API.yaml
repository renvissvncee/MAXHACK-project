schemaVersion: "1.0"

solution:
  name: "Приют"
  teamId: "priut"

api:
  baseUrl: "https://64.188.79.42"
  openapi: "./docs/openapi.json"
  defaultHeaders:
    Accept: "application/json"

checks:
  - id: "health-ready"
    name: "API and database readiness"
    method: "GET"
    path: "/api/health/ready"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["status"]
      bodySchema:
        type: object
        required: [status]
        properties:
          status:
            const: "ready"
    timeoutMs: 5000
    repeatable: true

  - id: "authentication-required"
    name: "Protected API rejects anonymous requests"
    method: "GET"
    path: "/api/me"
    role: "public"
    expected:
      statusCodes: [401]
      contentType: "application/json"
      requiredFields: ["error"]
    timeoutMs: 5000
    repeatable: true

  - id: "current-profile"
    name: "Read the authenticated MAX profile"
    method: "GET"
    path: "/api/me"
    role: "user"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "name", "city", "interests", "profileCompleted"]
    timeoutMs: 5000
    repeatable: true

  - id: "catalog"
    name: "Read the accommodation catalogue"
    method: "GET"
    path: "/api/listings"
    role: "user"
    request:
      query:
        guests: 1
        limit: 20
        offset: 0
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: array
        items:
          type: object
          required: ["id", "host", "city", "title", "availableFrom", "availableTo", "tags"]
    timeoutMs: 5000
    repeatable: true

  - id: "locality-search"
    name: "Search the official locality snapshot"
    method: "GET"
    path: "/api/localities/suggest"
    role: "user"
    request:
      query:
        q: "Казань"
        limit: 5
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: array
        items:
          type: object
          required: ["id", "name", "region", "fullLabel"]
    timeoutMs: 5000
    repeatable: true

  - id: "outgoing-requests"
    name: "Read the authenticated user's outgoing requests"
    method: "GET"
    path: "/api/requests"
    role: "user"
    request:
      query:
        direction: "outgoing"
        limit: 20
        offset: 0
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: array
    timeoutMs: 5000
    repeatable: true

# The API Judge must receive the user role's Authorization header through its
# protected form (Authorization: Bearer <temporary session token>). Never put a
# working session token in this file or anywhere else in the repository.
