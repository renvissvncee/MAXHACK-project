# Use with: docker compose -f compose.yaml -f compose.full.yaml up --build -d
services:
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
  bot:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: true
    environment:
      SSL_CERT_FILE: ${MAX_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}
      MAX_POLLING_CURSOR_FILE: /home/appuser/.state/max-marker.json
    command: ["python", "-m", "app.max_bot.polling"]
    volumes:
      - bot_state:/home/appuser/.state
      - ./.certs:/run/max-certs:ro
  notifications:
    build: ./backend
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: true
    environment:
      SSL_CERT_FILE: ${MAX_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-priut}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-priut}
      NOTIFICATION_DELIVERY_ENABLED: ${NOTIFICATION_DELIVERY_ENABLED:-false}
    command: ["python", "-m", "app.workers.notifications"]
    volumes:
      - ./.certs:/run/max-certs:ro
    depends_on:
      backend:
        condition: service_healthy
volumes:
  bot_state:
