services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-priut}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-priut}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:5173","http://localhost:8000"]}'
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-priut}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-priut}
    command: ["sh", "-c", "alembic upgrade head && python -m app.import_localities --confirm-official-snapshot && exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=4)"]
      start_period: 90s
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  postgres_data:
